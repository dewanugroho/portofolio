# Konfigurasi deploy Netlify (hosting cadangan).
# Hosting utama: Cloudflare Workers dengan Static Assets.
# Domain: set VITE_SITE_URL dan VITE_FORMSPREE_ID di panel environment
# variable hosting (bukan di repo).
#
# Header keamanan dan redirect ada di file netral hosting:
# - public/_headers  (didukung Cloudflare dan Netlify)
# - public/_redirects (didukung Cloudflare dan Netlify)
# File ini hanya menyimpan konfigurasi build khusus Netlify.

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback (jaga sebagai backup; _redirects juga sudah ada).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
